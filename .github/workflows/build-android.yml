name: Build Android (APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      # Release builds are signed with the runner's debug key (see android/app/build.gradle.kts),
      # so each run has a different signature and upgrades require uninstalling first.
      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/lizi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lizi-apk
          path: build/app/outputs/flutter-apk/lizi.apk
          retention-days: 14
