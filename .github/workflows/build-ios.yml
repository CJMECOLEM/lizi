name: Build iOS (unsigned IPA)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test

      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign

      # Sideloadly signs the IPA with your Apple ID during installation.
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry lizi-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: lizi-unsigned-ipa
          path: build/ipa/lizi-unsigned.ipa
          retention-days: 14
